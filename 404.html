<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — Amy Cheatle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #FFF5F5;
            --ink: #2b2220;
            --ink-soft: #5e4f4b;
            --ink-muted: #7a6964;
            --rule: #ead6d1;
            --accent: #8a3b12;
            --accent-hover: #6b2b0a;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 1.1875rem;
            line-height: 1.6;
            color: var(--ink-soft);
            background: var(--paper);
            max-width: 1080px;
            margin: 0 auto;
            padding: 96px clamp(24px, 6vw, 96px);
        }
        .label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--ink-muted);
            margin: 0 0 16px;
        }
        h1 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 2.4rem;
            font-weight: 400;
            line-height: 1.2;
            color: var(--ink);
            margin: 0 0 16px;
        }
        a {
            color: var(--accent);
            font-weight: 600;
            text-underline-offset: 0.18em;
            text-decoration-thickness: 1px;
        }
        a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
        @media (max-width: 600px) {
            body { padding: 56px 16px; font-size: 1.0625rem; }
            h1 { font-size: 1.85rem; }
        }
    </style>
</head>
<body>
    <main>
        <p class="label">404</p>
        <h1>This page has wandered off.</h1>
        <p>The link may be old, or the file may have moved.</p>
        <p><a href="/">Back to Amy Cheatle’s homepage</a></p>
    </main>
</body>
</html>
